<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛杉磯道奇隊球員介紹</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        header { background-color: #005A9C; color: white; text-align: center; padding: 20px 0; margin-bottom: 30px; border-radius: 8px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .position-section { background-color: white; border-left: 6px solid #005A9C; padding: 20px; margin-bottom: 25px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .position-title { color: #005A9C; margin-top: 0; font-size: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .player-card { background-color: #f9f9f9; border: 1px solid #e0e0e0; padding: 15px; border-radius: 6px; text-align: center; }
        .player-number { font-weight: bold; color: #ef3e36; font-size: 1.1rem; }
        .player-name { font-size: 1.2rem; font-weight: bold; margin: 5px 0; }
        .player-info { font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>洛杉磯道奇隊（Los Angeles Dodgers）球員陣容介紹</h1>
        <p>最新主力球員守備位置分類</p>
    </header>
    <div class="container">
        <!-- 投手區塊 -->
        <section class="position-section">
            <h2 class="position-title">⚾ 投手（Pitchers）</h2>
            <div class="player-grid">
                <div class="player-card"><div class="player-number">#11</div><div class="player-name">佐佐木朗希</div><div class="player-info">先發投手</div></div>
                <div class="player-card"><div class="player-number">#18</div><div class="player-name">山本由伸</div><div class="player-info">先發投手</div></div>
            </div>
        </section>
        <!-- 內野手區塊 -->
        <section class="position-section">
            <h2 class="position-title">⚾ 內野手（Infielders）</h2>
            <div class="player-grid">
                <div class="player-card"><div class="player-number">#5</div><div class="player-name">Freddie Freeman</div><div class="player-info">一壘手</div></div>
                <div class="player-card"><div class="player-number">#13</div><div class="player-name">Max Muncy</div><div class="player-info">三壘手</div></div>
            </div>
        </section>
        <!-- 外野手 / 指定打擊區塊 -->
        <section class="position-section">
            <h2 class="position-title">⚾ 外野手與指定打擊（Outfielders & DH）</h2>
            <div class="player-grid">
                <div class="player-card"><div class="player-number">#17</div><div class="player-name">大谷翔平</div><div class="player-info">指定打擊 (DH)</div></div>
                <div class="player-card"><div class="player-number">#50</div><div class="player-name">Mookie Betts</div><div class="player-info">外野手</div></div>
            </div>
        </section>
    </div>
</body>
</html>
